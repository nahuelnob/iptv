<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nodo</title>
  <!-- TV sizing only on a TV: the APK (Capacitor) or a TV browser. Runs before the CSS applies so the
       layout never paints at the wrong size first. -->
  <!-- Plain ES5 on purpose: this runs as written, without the build, on Chrome 66 TV WebViews. -->
  <script>
    (function () {
      var root = document.documentElement;
      var capacitor = window.Capacitor;
      var native = capacitor && capacitor.isNativePlatform && capacitor.isNativePlatform();
      if (native || /Android TV|GoogleTV|AFT|BRAVIA|SmartTV|SMART-TV|Tizen|Web0S|webOS|HbbTV/i.test(navigator.userAgent)) {
        root.classList.add('tv');
      }
      // Flex "gap" (Chrome 84+) cannot be detected with @supports, which answers for grid too:
      // measure it once and let the CSS fall back to margins (.no-flex-gap).
      var probe = document.createElement('div');
      probe.style.cssText = 'display:flex;gap:1px;position:absolute;visibility:hidden';
      probe.appendChild(document.createElement('i'));
      probe.appendChild(document.createElement('i'));
      root.appendChild(probe);
      if (probe.scrollWidth !== 1) root.classList.add('no-flex-gap');
      root.removeChild(probe);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" defer></script>
  <script src="src/main.js" type="module"></script>
</head>
<body>
  <!-- The rail is not focusable: with the remote, ◀ from the first tile column opens the drawer. -->
  <nav class="rail" aria-label="Secciones">
    <!-- Nodo mark (design/brand/logo/mark.svg), drawn as paths. The Hueso plate behind it is .brand__mark. -->
    <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#111111"/><path fill="#F5F4F0" d="M23 71V47A20 20 0 0 1 63 47V71H52V47A9 9 0 0 0 34 47V71Z"/><circle cx="75.2" cy="63.8" r="7.2" fill="#E8381E"/></svg></span>
    <button class="rail__item" type="button" tabindex="-1" data-go="home" aria-label="Inicio"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></button>
    <button class="rail__item" type="button" tabindex="-1" data-go="search" aria-label="Buscar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
    <button class="rail__item" type="button" tabindex="-1" data-go="favorites" aria-label="Favoritos"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
    <button class="rail__item" type="button" tabindex="-1" data-go="playlist" aria-label="Lista"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <span class="rail__sep" aria-hidden="true"></span>
    <button class="rail__item" type="button" tabindex="-1" data-open-cats aria-label="Categorías"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
  </nav>

  <div class="scrim" data-scrim hidden></div>
  <aside class="drawer" data-drawer data-nav-scope hidden aria-label="Menú y categorías">
    <ul class="drawer__nav" aria-label="Secciones">
      <li><button class="drawer__item" type="button" data-nav data-go="home"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</button></li>
      <li><button class="drawer__item" type="button" data-nav data-go="search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Buscar</button></li>
      <li><button class="drawer__item" type="button" data-nav data-go="favorites"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Favoritos</button></li>
      <li><button class="drawer__item" type="button" data-nav data-go="playlist"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Lista</button></li>
    </ul>
    <p class="drawer__label" id="drawer-cats"><span>Categorías</span><span data-cats-total></span></p>
    <!-- Overflow cues overlay the list edges and only show when the list actually scrolls. -->
    <div class="drawer__scroller">
      <ul class="drawer__cats" aria-labelledby="drawer-cats" data-cats></ul>
      <p class="drawer__cue drawer__cue--start" data-cue-start aria-hidden="true" hidden></p>
      <p class="drawer__cue drawer__cue--end" data-cue-end aria-hidden="true" hidden></p>
    </div>
  </aside>

  <div class="shell">
    <header class="top" data-zone="top">
      <button class="crumb" type="button" data-nav data-open-cats data-entry><span class="crumb__section" data-crumb-section>Inicio</span><span class="crumb__sep" data-crumb-sep aria-hidden="true">›</span><span class="crumb__cat" data-crumb-cat>Todos los canales</span></button>
      <span class="top__hint">◀ Menú y categorías</span>
      <p class="status"><span class="status__clock" data-clock></span><span class="status__context" data-context></span></p>
    </header>

    <main data-zone="content">
      <section data-view="grid" hidden>
        <div class="info" aria-live="polite">
          <h2 class="info__name" data-info-name></h2>
          <p class="info__meta" data-info-meta></p>
        </div>
        <ul class="grid" data-grid></ul>
      </section>

      <section class="search" data-view="search" hidden>
        <input class="search__field" type="search" data-nav data-search-input placeholder="Buscá un canal"
               aria-label="Nombre del canal" autocomplete="off" spellcheck="false">
        <p class="results__label" data-results-label aria-live="polite"></p>
        <ul class="grid" data-results></ul>
      </section>

      <section data-view="message" hidden><div data-message></div></section>
    </main>
  </div>

  <input class="visually-hidden" type="file" tabindex="-1" data-source-file
         accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl">
  <p class="visually-hidden" role="status" aria-live="polite" data-announce></p>

  <div class="player" data-player data-nav-scope hidden role="dialog" aria-modal="true" aria-labelledby="player-title">
    <!-- No native controls: live TV driven by the D-pad; the title and strip are the controls. -->
    <!-- The transparent poster stops Android's WebView from drawing its gray play icon on an empty video. -->
    <video class="player__video" playsinline
           poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
    <!-- tabindex -1 keeps focus (and the Back key) in this page instead of inside YouTube's frame. -->
    <iframe class="player__video" data-player-embed hidden tabindex="-1" title="Reproductor de YouTube"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="player__title">
      <span class="player__no" data-player-no></span><b id="player-title" data-player-name></b><span class="player__meta" data-player-meta></span>
      <button class="star" type="button" data-nav data-player-fav aria-pressed="false" aria-label="Agregar a favoritos"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
    </div>
    <div class="player__notices">
      <p class="player__notice" data-player-notice role="status" hidden></p>
      <p class="player__status" data-player-status role="status" aria-live="polite" hidden></p>
    </div>
    <!-- Channel column: ▲ ▼ move a cursor without leaving the channel on screen, OK switches to it. -->
    <nav class="strip" data-strip aria-label="Canales">
      <div class="strip__head">
        <span class="strip__label">Canales</span>
        <span class="strip__pos" data-strip-pos></span>
      </div>
      <ul class="strip__list" data-strip-list></ul>
      <p class="strip__hint"><kbd>▲ ▼</kbd> recorrer <kbd>OK</kbd> ver</p>
    </nav>
    <div class="player__actions">
      <button class="button" type="button" data-nav data-player-unmute hidden>Activar sonido</button>
      <button class="button" type="button" data-nav data-player-close>Volver</button>
    </div>
  </div>

  <!-- Android app only: offered when a newer APK is published (src/ui/update-prompt.js). -->
  <div class="update" data-update data-nav-scope hidden role="dialog" aria-modal="true"
       aria-labelledby="update-title" aria-describedby="update-text">
    <div class="panel update__card">
      <h2 id="update-title">Hay una versión nueva de Nodo</h2>
      <p id="update-text" data-update-text></p>
      <p class="update__status" data-update-status role="status" aria-live="polite" hidden></p>
      <div class="actions">
        <button class="button button--primary" type="button" data-nav data-update-accept>Actualizar</button>
        <button class="button" type="button" data-nav data-update-dismiss>Ahora no</button>
      </div>
    </div>
  </div>
</body>
</html>
