<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nodo · Sin conexión</title>
  <!-- Android app only: Capacitor shows this bundled page (server.errorPath) when the app, which loads
       from GitHub Pages, cannot reach it. Self-contained: no fonts, styles or scripts from the network. -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0e0e0e; color: #f5f4f0;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; line-height: 1.55;
    }
    main { max-width: 36rem; padding: 2rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; letter-spacing: -0.02em; }
    p { margin: 0 0 2rem; font-size: 1.25rem; color: #c9c7c1; }
    button {
      font: 600 1.25rem/1.3 system-ui, "Segoe UI", Roboto, sans-serif;
      padding: 0.9rem 2rem; border: 0; border-radius: 999px; background: #f5f4f0; color: #111111;
    }
    button:focus-visible, button:focus { outline: 4px solid #e8381e; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Sin conexión</h1>
    <p>Nodo necesita internet para abrirse. Revisá la conexión de la tele y volvé a intentar.</p>
    <button type="button" autofocus data-retry>Reintentar</button>
  </main>
  <script>
    const APP_URL = 'https://nahuelnob.github.io/iptv/';
    const retry = document.querySelector('[data-retry]');
    retry.addEventListener('click', () => location.replace(APP_URL));
    retry.focus();
  </script>
</body>
</html>
